<!doctype html>
<meta charset="utf-8" />
<title>hevyier — phone</title>
<style>
  :root { --w: 393px; --h: 852px; }
  html, body { height: 100%; margin: 0; background: #111; color: #666;
    font: 13px ui-monospace, monospace; display: grid; place-items: center; gap: 14px;
    grid-auto-flow: row; align-content: center; }
  .frame { width: var(--w); height: var(--h); border: 10px solid #222; border-radius: 34px;
    overflow: hidden; background: #000; box-shadow: 0 0 0 1px #333, 0 30px 60px #000; }
  iframe { width: 100%; height: 100%; border: 0; display: block; }
  .bar { display: flex; gap: 8px; align-items: center; }
  button, select { background: #1a1a1a; color: #ccc; border: 1px solid #333; padding: 5px 9px;
    font: inherit; cursor: pointer; }
  button:hover, select:hover { background: #262626; }
</style>
<div class="bar">
  <select id="device">
    <option value="393x852">iPhone 15 · 393×852</option>
    <option value="390x844">iPhone 12/13/14 · 390×844</option>
    <option value="360x800">Android médio · 360×800</option>
    <option value="412x915">Pixel 7 · 412×915</option>
    <option value="320x568">SE 1ª ger · 320×568</option>
  </select>
  <button id="reload">recarregar</button>
  <span id="url"></span>
</div>
<div class="frame" id="frame"><iframe id="app" src="http://localhost:8081"></iframe></div>
<script>
  const frame = document.getElementById("frame");
  const app = document.getElementById("app");
  document.getElementById("url").textContent = app.src;
  document.getElementById("device").onchange = (e) => {
    const [w, h] = e.target.value.split("x");
    frame.style.width = w + "px";
    frame.style.height = h + "px";
  };
  // Re-assigning src (rather than iframe.contentWindow.location.reload) avoids
  // touching the cross-origin-ish frame and always lands on the entry route.
  document.getElementById("reload").onclick = () => { app.src = app.src; };
</script>
